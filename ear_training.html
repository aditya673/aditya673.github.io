<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="हिंदुस्तानी शास्त्रीय संगीत के स्वरों और रागों के अभ्यास के लिए श्रवण प्रशिक्षण।">
    <title>स्वर अभ्यास — श्रवण प्रशिक्षण</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&family=Noto+Sans+Devanagari:wght@400;500;600;700">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #426BBA;
            --blue-dark: #315798;
            --text: #333;
            --muted: #666;
            --light-muted: #888;
            --border: #e8e8e8;
            --surface: #fff;
            --surface-soft: #f8f9fb;
            --success: #27834a;
            --error: #c33d3d;
            --ati: #8a3f7a;
            --ati-bg: #fbf3fa;
        }

        body {
            font-family: 'Roboto', 'Noto Sans Devanagari', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            color: var(--text);
            background: #fff;
            min-height: 100vh;
        }

        button, input, select { font: inherit; }
        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1, h2, h3 { font-weight: 400; color: #000; }

        .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
        .page-header { padding: 34px 0 25px; text-align: center; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #555;
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .back-link:hover { color: var(--blue); }
        .back-arrow { font-size: 1.2rem; line-height: 1; }
        .page-title { font-size: 2.2rem; font-weight: 400; color: #000; line-height: 1.3; }
        .page-subtitle { font-size: 1.1rem; color: var(--muted); margin-top: 5px; }

        .app-layout { display: flex; flex-direction: column; gap: 18px; padding-bottom: 48px; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 22px;
        }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
        .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
        .field-label { color: #555; font-size: 0.9rem; font-weight: 500; }
        select {
            width: 100%;
            min-height: 42px;
            padding: 8px 10px;
            color: var(--text);
            background: #fff;
            border: 1px solid #d8dce3;
            border-radius: 6px;
            cursor: pointer;
        }
        select:focus, input:focus-visible, button:focus-visible, a:focus-visible {
            outline: 2px solid rgba(66, 107, 186, 0.35);
            outline-offset: 2px;
        }
        .checkbox-list { display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
        .check-label { display: flex; align-items: center; gap: 9px; color: #444; font-size: 0.92rem; cursor: pointer; }
        .check-label input { width: 16px; height: 16px; accent-color: var(--blue); }

        /* राग की जानकारी */
        .raga-info { padding: 18px 22px; }
        .raga-info-title { color: #555; font-size: 0.9rem; font-weight: 500; margin-bottom: 10px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 54px;
            padding: 5px 10px 4px;
            border: 1px solid #dfe3e9;
            border-radius: 8px;
            background: #fff;
            color: var(--blue);
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .chip small { font-size: 0.62rem; font-weight: 400; color: #777; }
        .chip.vikrit { color: #97652e; }
        .chip.ati { color: var(--ati); border-color: #dcb8d5; background: var(--ati-bg); }
        .chip.ati small { color: var(--ati); font-weight: 500; }
        .raga-note { margin-top: 12px; color: #555; font-size: 0.9rem; font-weight: 400; line-height: 1.65; }
        .raga-note:empty { display: none; }

        .volume-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
        .volume-field { display: flex; flex-direction: column; gap: 10px; }
        .volume-heading { display: flex; justify-content: space-between; align-items: center; color: #555; font-size: 0.92rem; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: var(--blue); cursor: pointer; }

        .game-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: stretch; }
        .sidebar { display: flex; flex-direction: column; gap: 18px; }
        .tanpura-panel { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .panel-heading { color: #555; font-size: 0.95rem; font-weight: 500; margin-bottom: 14px; }
        .tanpura-button {
            width: 78px;
            height: 78px;
            border: 2px solid #cbd4e4;
            border-radius: 50%;
            background: #f4f7fc;
            color: var(--blue-dark);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .tanpura-button:hover { border-color: var(--blue); transform: translateY(-1px); }
        .tanpura-button.is-on { background: var(--blue); border-color: var(--blue); color: #fff; }
        .panel-note { color: var(--light-muted); font-size: 0.82rem; margin-top: 12px; }

        .score-panel { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .score-title { color: #555; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; }
        .score-line { display: flex; justify-content: center; align-items: baseline; gap: 9px; color: #999; font-size: 1.5rem; }
        .score-line .correct-score { color: var(--success); font-size: 2.4rem; font-weight: 400; }
        .score-line .total-score { color: #555; font-size: 2rem; font-weight: 400; }
        .score-caption { color: var(--light-muted); font-size: 0.78rem; margin-top: 2px; }
        .streak-line { color: #555; font-size: 0.85rem; font-weight: 400; margin-top: 8px; }
        .text-button { border: 0; background: transparent; color: var(--blue); cursor: pointer; font-size: 0.86rem; margin-top: 12px; }
        .text-button:hover:not(:disabled) { text-decoration: underline; }

        .game-panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
        .interaction-stage {
            background: var(--surface-soft);
            border: 1px solid #edf0f4;
            border-radius: 8px;
            padding: 25px 18px 20px;
            text-align: center;
        }
        .action-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
        .tools-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 24px; }
        .tools-row .text-button { margin-top: 0; }
        .primary-button, .secondary-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .primary-button { border: 1px solid var(--blue); color: #fff; background: var(--blue); }
        .primary-button:hover:not(:disabled) { background: var(--blue-dark); border-color: var(--blue-dark); }
        .secondary-button { border: 1px solid #d8dce3; color: #444; background: #fff; }
        .secondary-button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
        .primary-button:active:not(:disabled), .secondary-button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: 0.42; cursor: not-allowed; }
        .button-icon { font-size: 1.1rem; line-height: 1; }

        .guess-title { color: #666; font-size: 0.88rem; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 12px; }
        .guess-visualizer { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; min-height: 64px; }
        .guess-slot {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 66px;
            min-height: 62px;
            padding: 7px 3px;
            border: 1px solid #dfe3e9;
            border-radius: 8px;
            background: #fff;
            color: #333;
        }
        .guess-slot .slot-symbol { font-size: 1.35rem; font-weight: 600; line-height: 1.25; }
        .guess-slot .slot-detail { font-size: 0.62rem; color: #777; line-height: 1.2; }
        .guess-slot.empty { background: #fff; color: #aaa; font-size: 1.35rem; }
        .guess-slot.correct { border-color: #8fcba4; background: #f2faf4; color: var(--success); }
        .guess-slot.correct .slot-detail { color: #568565; }
        .guess-slot.incorrect { border-color: #e5a0a0; background: #fff5f5; color: var(--error); }
        .guess-slot.incorrect .slot-detail { color: #a66b6b; }
        .octave-dot {
            position: absolute;
            left: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            transform: translateX(-50%);
            opacity: 0.7;
        }
        .octave-dot.top { top: 5px; }
        .octave-dot.bottom { bottom: 5px; }
        .feedback {
            min-height: 30px;
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 400;
            color: #666;
        }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }

        .swara-grids { display: flex; flex-direction: column; gap: 16px; }
        .swara-grid { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); gap: 9px; }
        .swara-grid.hidden { display: none; }
        .swara-btn {
            position: relative;
            min-height: 78px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 9px 5px;
            border: 1px solid #e0e4ea;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s, transform 0.18s;
        }
        .swara-btn:hover:not(:disabled) { border-color: var(--blue); background: #f7f9fd; transform: translateY(-1px); }
        .swara-btn.shuddha { color: var(--blue); }
        .swara-btn.vikrit { color: #97652e; }
        .swara-btn.ati { color: var(--ati); background: var(--ati-bg); border-color: #dcb8d5; }
        .swara-btn.ati:hover:not(:disabled) { border-color: var(--ati); background: #f7e9f4; }
        .swara-btn:disabled { background: #fafafa; border-color: #eee; opacity: 0.42; }
        .swara-btn.out-of-raga { display: none; }
        .swara-symbol { font-size: 1.55rem; font-weight: 600; line-height: 1.35; }
        .swara-detail { color: #777; font-size: 0.72rem; font-weight: 400; }
        .swara-btn.ati .swara-detail { color: var(--ati); font-weight: 500; }
        .grid-label { color: #888; font-size: 0.78rem; font-weight: 500; margin-bottom: 6px; }

        .page-header { position: relative; }
        .lang-toggle {
            position: absolute; top: 34px; right: 0;
            padding: 6px 14px; border: 1px solid #d8dce3; border-radius: 999px;
            background: #fff; color: #444; font-size: 0.9rem; font-weight: 500; cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .lang-toggle:hover { border-color: var(--blue); color: var(--blue); }
        .shruti-ref { padding: 0; }
        .shruti-ref summary { cursor: pointer; padding: 16px 22px; color: #555; font-size: 0.95rem; font-weight: 500; }
        .shruti-ref[open] summary { border-bottom: 1px solid var(--border); }
        .ref-body { padding: 16px 22px 22px; }
        .ref-intro { color: #666; font-size: 0.88rem; font-weight: 400; margin-bottom: 14px; line-height: 1.65; }
        .table-wrap { overflow-x: auto; }
        .ref-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-weight: 400; }
        .ref-table th, .ref-table td { padding: 7px 10px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
        .ref-table thead th { color: #555; font-weight: 500; background: var(--surface-soft); }
        .ref-table tbody th { color: #000; font-weight: 500; vertical-align: top; background: #fff; }

        @media (max-width: 760px) {
            .game-layout { grid-template-columns: 1fr; }
            .sidebar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .score-panel { min-height: 160px; }
        }
        @media (max-width: 520px) {
            .container { padding: 0 14px; }
            .page-header { padding: 24px 0 20px; }
            .page-title { font-size: 1.85rem; }
            .page-subtitle { font-size: 0.98rem; }
            .panel { padding: 16px; }
            .settings-grid, .volume-grid { grid-template-columns: 1fr; gap: 15px; }
            .sidebar { grid-template-columns: 1fr 1fr; gap: 12px; }
            .tanpura-panel, .score-panel { padding: 15px 10px; }
            .game-panel { padding: 14px; }
            .interaction-stage { padding: 19px 10px 15px; }
            .swara-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .primary-button, .secondary-button { width: 100%; }
            .action-row { gap: 9px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <button id="langToggle" class="lang-toggle" type="button">English</button>
            <a class="back-link" href="index.html"><span class="back-arrow" aria-hidden="true">←</span> <span data-i18n="backLink">पोर्टफोलियो पर वापस</span></a>
            <h1 class="page-title" data-i18n="title">स्वर अभ्यास</h1>
            <p class="page-subtitle" data-i18n="subtitle">हिंदुस्तानी शास्त्रीय संगीत — श्रवण प्रशिक्षण</p>
        </header>

        <div class="app-layout">
            <section class="panel settings-grid">
                <div class="field">
                    <label class="field-label" for="scaleSelect" data-i18n="lblScale">आधार स्वर (सा)</label>
                    <select id="scaleSelect"></select>
                </div>
                <div class="field">
                    <label class="field-label" for="ragaSelect" data-i18n="lblRaga">राग</label>
                    <select id="ragaSelect"></select>
                </div>
                <div class="field">
                    <label class="field-label" for="tuningSelect" data-i18n="lblTuning">स्वरस्थान</label>
                    <select id="tuningSelect">
                        <option value="raga" data-i18n="tuningRaga">राग के अनुसार श्रुति</option>
                        <option value="standard" data-i18n="tuningStd">सामान्य (शुद्ध अंतराल)</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="modeSelect" data-i18n="lblMode">अभ्यास का प्रकार</label>
                    <select id="modeSelect">
                        <option value="1" data-i18n="mode1">एकल स्वर</option>
                        <option value="2" data-i18n="mode2">दो स्वरों का क्रम</option>
                        <option value="3" data-i18n="mode3">तीन स्वरों का क्रम</option>
                        <option value="4" data-i18n="mode4">चार स्वरों का क्रम</option>
                        <option value="5" data-i18n="mode5">पाँच स्वरों का क्रम</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="stepSelect" data-i18n="lblStep">स्वरों के बीच की दूरी</label>
                    <select id="stepSelect">
                        <option value="near" data-i18n="stepNear">निकट स्वर (सरल)</option>
                        <option value="mid" data-i18n="stepMid">मध्यम</option>
                        <option value="any" data-i18n="stepAny">कोई भी स्वर (कठिन)</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="tanpuraTuneSelect" data-i18n="lblTanpuraTune">तानपुरे का मिलान</label>
                    <select id="tanpuraTuneSelect"></select>
                </div>
                <div class="field">
                    <span class="field-label" data-i18n="lblOctave">सप्तक</span>
                    <div class="checkbox-list">
                        <label class="check-label"><input type="checkbox" id="mandraCheck"> <span data-i18n="mandra">मंद्र सप्तक</span></label>
                        <label class="check-label"><input type="checkbox" id="taarCheck"> <span data-i18n="taar">तार सप्तक</span></label>
                    </div>
                </div>
            </section>

            <section class="panel raga-info">
                <h2 class="raga-info-title" id="ragaInfoTitle"></h2>
                <div id="ragaChips" class="chips"></div>
                <p id="ragaNote" class="raga-note"></p>
            </section>

            <section class="panel volume-grid">
                <div class="volume-field">
                    <label class="volume-heading" for="fluteVolSlider" data-i18n="volFlute">बाँसुरी की ध्वनि</label>
                    <input type="range" id="fluteVolSlider" min="0" max="1" step="0.05" value="0.7">
                </div>
                <div class="volume-field">
                    <label class="volume-heading" for="tanpuraVolSlider" data-i18n="volTanpura">तानपुरे की ध्वनि</label>
                    <input type="range" id="tanpuraVolSlider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </section>

            <div class="game-layout">
                <aside class="sidebar">
                    <section class="panel tanpura-panel">
                        <h2 class="panel-heading" data-i18n="tanpura">तानपुरा</h2>
                        <button id="tanpuraToggleBtn" class="tanpura-button" type="button" aria-pressed="false">
                            <span id="tanpuraStateText">बंद</span>
                        </button>
                        <p class="panel-note" data-i18n="tanpuraNote">चार तारों की तानपुरा ध्वनि</p>
                    </section>

                    <section class="panel score-panel">
                        <h2 class="score-title" data-i18n="scoreTitle">आपकी शुद्धता</h2>
                        <div class="score-line">
                            <span id="scoreVal" class="correct-score">०</span>
                            <span>/</span>
                            <span id="totalVal" class="total-score">०</span>
                        </div>
                        <p class="score-caption" data-i18n="scoreCaption">सही उत्तर / कुल प्रयास</p>
                        <p class="streak-line"><span data-i18n="streak">लगातार सही:</span> <span id="streakVal">०</span></p>
                        <button id="resetScoreBtn" class="text-button" type="button" data-i18n="reset">अंक रीसेट करें</button>
                    </section>
                </aside>

                <section class="panel game-panel">
                    <div class="interaction-stage">
                        <div class="action-row">
                            <button id="playPromptBtn" class="primary-button" type="button">
                                <span class="button-icon" aria-hidden="true">▶</span>
                                <span data-i18n="btnPlay">स्वर सुनें</span>
                            </button>
                            <button id="repeatPromptBtn" class="secondary-button" type="button" disabled>
                                <span class="button-icon" aria-hidden="true">↻</span>
                                <span data-i18n="btnRepeat">पुनः सुनें</span>
                            </button>
                        </div>
                        <div class="tools-row">
                            <button id="playSaBtn" class="text-button" type="button" data-i18n="btnSa">सा सुनें</button>
                            <button id="playRagaBtn" class="text-button" type="button" data-i18n="btnRaga">राग के स्वर सुनें</button>
                            <button id="revealBtn" class="text-button" type="button" data-i18n="btnReveal" disabled>उत्तर दिखाएँ</button>
                        </div>

                        <div class="guess-area">
                            <h2 class="guess-title" data-i18n="guessTitle">आपका अनुमान</h2>
                            <div id="guessVisualizer" class="guess-visualizer"></div>
                        </div>

                        <div id="feedbackText" class="feedback" role="status" aria-live="polite"></div>
                    </div>

                    <div class="swara-grids">
                        <div>
                            <div id="taarLabel" class="grid-label" data-i18n="taar" hidden>तार सप्तक</div>
                            <div id="taarGrid" class="swara-grid hidden"></div>
                        </div>
                        <div>
                            <div id="madhyaLabel" class="grid-label" data-i18n="madhya" hidden>मध्य सप्तक</div>
                            <div id="madhyaGrid" class="swara-grid"></div>
                        </div>
                        <div>
                            <div id="mandraLabel" class="grid-label" data-i18n="mandra" hidden>मंद्र सप्तक</div>
                            <div id="mandraGrid" class="swara-grid hidden"></div>
                        </div>
                    </div>
                    <p class="panel-note" data-i18n="panelNote"></p>
                </section>
            </div>

            <details class="panel shruti-ref">
                <summary data-i18n="refTitle">श्रुति-स्थान की तालिका</summary>
                <div id="shrutiRef" class="ref-body"></div>
            </details>
        </div>
    </main>

    <script>
        /* संगीत-सिद्धान्त और स्थिरांक */

        // आधार स्वर: मध्य सप्तक के पश्चिमी पिचों के समतुल्य नाम देवनागरी में।
        const SCALES = [
            { name: 'सी', freq: 261.63 },
            { name: 'सी तीव्र / डी कोमल', freq: 277.18 },
            { name: 'डी', freq: 293.66 },
            { name: 'डी तीव्र / ई कोमल', freq: 311.13 },
            { name: 'ई', freq: 329.63 },
            { name: 'एफ', freq: 349.23 },

        function octaveWord(id) { return OCTAVE_WORD[lang][id]; }
        function detailText(hiText) { return lang === 'hi' ? hiText : (DETAIL_EN[hiText] || hiText); }

        // भिन्न के रूप में अनुपात (जैसे 256/243)।
        function ratioText(ratio) {
            for (let den = 1; den <= 128; den++) {
                const numerator = Math.round(ratio * den);
                if (Math.abs(numerator / den - ratio) < 1e-9) return `${num(numerator)}/${num(den)}`;
            }
            return ratio.toFixed(4);
        }

        const DEVANAGARI_DIGITS = '०१२३४५६७८९';
        function toDevanagariDigits(value) {
            return String(value).replace(/[0-9]/g, digit => DEVANAGARI_DIGITS[Number(digit)]);
        }

        /* अनुप्रयोग की स्थिति */
        let audioCtx = null;
        let fluteMasterGain = null;
        let tanpuraMasterGain = null;
        let fluteWave = null;
        let fluteBus = null;
        let breathBuffer = null;
        let baseFreq = SCALES[1].freq;

        const state = {
            raga: 'yaman',
            modeLength: 1,
            difficulty: 'near',
            tuning: 'raga',
            tanpuraTune: 'auto',
            isPlaying: false,
            tanpuraOn: false,
            tanpuraInterval: null,
            score: 0,
            total: 0,
            streak: 0,
            promptSequence: [],
            guessSequence: []
        };

        const $ = id => document.getElementById(id);
        const els = {
            scaleSelect: $('scaleSelect'),
            ragaSelect: $('ragaSelect'),
            tuningSelect: $('tuningSelect'),
            modeSelect: $('modeSelect'),
            stepSelect: $('stepSelect'),
            tanpuraTuneSelect: $('tanpuraTuneSelect'),
            mandraCheck: $('mandraCheck'),
            taarCheck: $('taarCheck'),
            ragaChips: $('ragaChips'),
            ragaNote: $('ragaNote'),
            ragaInfoTitle: $('ragaInfoTitle'),
            tanpuraToggleBtn: $('tanpuraToggleBtn'),
            tanpuraStateText: $('tanpuraStateText'),
            playPromptBtn: $('playPromptBtn'),
            repeatPromptBtn: $('repeatPromptBtn'),
            playSaBtn: $('playSaBtn'),
            playRagaBtn: $('playRagaBtn'),
            revealBtn: $('revealBtn'),
            guessVisualizer: $('guessVisualizer'),
            feedbackText: $('feedbackText'),
            taarGrid: $('taarGrid'),
            madhyaGrid: $('madhyaGrid'),
            mandraGrid: $('mandraGrid'),
            taarLabel: $('taarLabel'),
            madhyaLabel: $('madhyaLabel'),
            mandraLabel: $('mandraLabel'),
            scoreVal: $('scoreVal'),
            totalVal: $('totalVal'),
            streakVal: $('streakVal'),
            resetBtn: $('resetScoreBtn'),
            fluteVolSlider: $('fluteVolSlider'),
            tanpuraVolSlider: $('tanpuraVolSlider'),
            langToggle: $('langToggle'),
            shrutiRef: $('shrutiRef')
        };

        /* श्रुति-स्थान की गणना */

        // वर्तमान राग और स्वरस्थान-सेटिंग के अनुसार स्वर का वास्तविक अनुपात।
        function effectiveRatio(swara, ragaKey = state.raga) {
            const raga = RAGAS[ragaKey];
            if (state.tuning === 'raga' && raga.tuning && raga.tuning[swara.id] !== undefined) {
                return raga.tuning[swara.id];
            }
            return swara.ratio;
        }

        function isAti(swara, ratio) {
            return swara.ati !== undefined && Math.abs(ratio - swara.ati) < 1e-9;
        }

        function swaraDetail(swara) {
            return detailText(isAti(swara, effectiveRatio(swara)) ? 'अति कोमल' : swara.detail);
        }

        function swaraName(swara) {
            if (swara.id === 'S' || swara.id === 'P') return sym(swara);
            return `${sym(swara)} (${swaraDetail(swara)})`;
        }

        function centsOf(ratio) {
            return 1200 * Math.log2(ratio);
        }

        function centsText(ratio) {
            return `${num(Math.round(centsOf(ratio)))} ${t('cents')}`;
        }

        function hasAndolan(swara) {
            const raga = RAGAS[state.raga];
            return state.tuning === 'raga' && Array.isArray(raga.andolan) && raga.andolan.includes(swara.id);
        }

        /* ध्वनि निर्माण */
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                fluteMasterGain = audioCtx.createGain();
                fluteMasterGain.gain.value = els.fluteVolSlider.value;
                fluteMasterGain.connect(audioCtx.destination);

                tanpuraMasterGain = audioCtx.createGain();
                tanpuraMasterGain.gain.value = els.tanpuraVolSlider.value;
                tanpuraMasterGain.connect(audioCtx.destination);

                // बाँसुरी जैसी कोमल तरंग: मूल स्वर प्रबल, ऊँचे हार्मोनिक हल्के।
                fluteWave = audioCtx.createPeriodicWave(
                    new Float32Array([0, 0, 0, 0, 0, 0]),
                    new Float32Array([0, 1, 0.22, 0.1, 0.04, 0.02])
                );

                // फूँक की हल्की सरसराहट के लिए दोहराया जाने वाला शोर।
                breathBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const breathData = breathBuffer.getChannelData(0);
                for (let i = 0; i < breathData.length; i++) breathData[i] = Math.random() * 2 - 1;

                // बाँसुरी → (सीधी ध्वनि + हल्की गूँज) → मास्टर वॉल्यूम।
                fluteBus = audioCtx.createGain();
                const dry = audioCtx.createGain();
                const wet = audioCtx.createGain();
                const reverb = audioCtx.createConvolver();
                reverb.buffer = buildImpulse(1.5, 2.8);
                dry.gain.value = 0.85;
                wet.gain.value = 0.22;
                fluteBus.connect(dry);
                dry.connect(fluteMasterGain);
                fluteBus.connect(reverb);
                reverb.connect(wet);
                wet.connect(fluteMasterGain);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // कक्ष जैसी हल्की गूँज के लिए कृत्रिम आवेग-प्रतिक्रिया।
        function buildImpulse(seconds, decay) {
            const length = Math.floor(audioCtx.sampleRate * seconds);
            const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            return impulse;
        }

        function playFluteNote(swara, saptakMult, timeOffset, duration = 0.8) {
            const freq = baseFreq * effectiveRatio(swara) * saptakMult;
            const t0 = audioCtx.currentTime + timeOffset;
            const end = t0 + duration;
            const andolan = hasAndolan(swara);

            // स्वर: आरम्भ में पल भर का हल्का उठान, फिर स्थिर।
            const osc = audioCtx.createOscillator();
            osc.setPeriodicWave(fluteWave);
            osc.frequency.setValueAtTime(freq * 0.985, t0);
            osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.07);

            // कंपन (सेंट में): देर से शुरू होने वाला हल्का; आंदोलन वाले स्वर पर धीमा और चौड़ा।
            const vibrato = audioCtx.createOscillator();
            const vibratoDepth = audioCtx.createGain();
            vibrato.frequency.setValueAtTime(andolan ? 3 : 5.2, t0);
            vibratoDepth.gain.setValueAtTime(0, t0);
            vibratoDepth.gain.setValueAtTime(0, t0 + 0.15);
            vibratoDepth.gain.linearRampToValueAtTime(andolan ? 22 : 7, t0 + 0.5);
            vibrato.connect(vibratoDepth);
            vibratoDepth.connect(osc.detune);

            // ऊँचे हार्मोनिक आरम्भ में थोड़े खुले, फिर नर्म।
            const tone = audioCtx.createBiquadFilter();
            tone.type = 'lowpass';
            tone.Q.setValueAtTime(0.6, t0);
            tone.frequency.setValueAtTime(Math.min(freq * 7, 12000), t0);
            tone.frequency.exponentialRampToValueAtTime(Math.min(freq * 4, 9000), t0 + 0.25);

            // साँस के दबाव जैसा आयाम।
            const attack = 0.07;
            const release = Math.min(0.14, duration / 3);
            const amp = audioCtx.createGain();
            amp.gain.setValueAtTime(0, t0);
            amp.gain.linearRampToValueAtTime(0.75, t0 + attack);
            amp.gain.linearRampToValueAtTime(0.58, t0 + attack + 0.22);
            amp.gain.setValueAtTime(0.58, end - release);
            amp.gain.linearRampToValueAtTime(0, end);

            // साँस की बहुत हल्की धड़कन।
            const tremolo = audioCtx.createOscillator();
            const tremoloDepth = audioCtx.createGain();
            const tremoloGain = audioCtx.createGain();
            tremolo.frequency.setValueAtTime(4.6, t0);
            tremoloDepth.gain.setValueAtTime(0.03, t0);
            tremoloGain.gain.setValueAtTime(0.97, t0);
            tremolo.connect(tremoloDepth);
            tremoloDepth.connect(tremoloGain.gain);

            // फूँक की सरसराहट।
            const breath = audioCtx.createBufferSource();
            const breathFilter = audioCtx.createBiquadFilter();
            const breathGain = audioCtx.createGain();
            breath.buffer = breathBuffer;
            breath.loop = true;
            breathFilter.type = 'bandpass';
            breathFilter.frequency.setValueAtTime(Math.min(freq * 2.2, 6000), t0);
            breathFilter.Q.setValueAtTime(1.2, t0);
            breathGain.gain.setValueAtTime(0, t0);
            breathGain.gain.linearRampToValueAtTime(0.09, t0 + 0.03);
            breathGain.gain.linearRampToValueAtTime(0.035, t0 + 0.2);
            breathGain.gain.setValueAtTime(0.035, end - release);
            breathGain.gain.linearRampToValueAtTime(0, end);

            osc.connect(tone);
            tone.connect(amp);
            amp.connect(tremoloGain);
            tremoloGain.connect(fluteBus);
            breath.connect(breathFilter);
            breathFilter.connect(breathGain);
            breathGain.connect(fluteBus);

            osc.start(t0);
            vibrato.start(t0);
            tremolo.start(t0);
            breath.start(t0, Math.random() * 1.5);
            [osc, vibrato, tremolo, breath].forEach(node => node.stop(end + 0.05));
        }

        // items: [{ swara, mult }]
        function playItems(items, { noteDuration = 0.8, gap = 0.1, onDone = null } = {}) {
            initAudio();
            state.isPlaying = true;
            updateControls();

            items.forEach((item, index) => {
                playFluteNote(item.swara, item.mult, index * (noteDuration + gap), noteDuration);
            });

            const totalDuration = items.length * (noteDuration + gap) * 1000;
            window.setTimeout(() => {
                state.isPlaying = false;
                updateControls();
                if (onDone) onDone();
            }, totalDuration);
        }

        function sequenceToItems(sequence) {
            return sequence.map(note => ({
                swara: SWARAS.find(s => s.id === note.swaraId),
                mult: SAPTAKS.find(s => s.id === note.saptakId).mult
            }));
        }

        function playSequence(sequence) {
            playItems(sequenceToItems(sequence));
        }

        function playSingleNotePreview(saptakId, swaraId) {
            const swara = SWARAS.find(item => item.id === swaraId);
            const saptak = SAPTAKS.find(item => item.id === saptakId);
            initAudio();
            playFluteNote(swara, saptak.mult, 0, 0.5);
        }

        function playReferenceSa() {
            if (state.isPlaying) return;
            initAudio();
            playItems([{ swara: SWARAS[0], mult: 1 }], { noteDuration: 1.8, gap: 0.1 });
        }

        // राग के स्वर: मध्य सप्तक का आरोह, तार सा, फिर अवरोह (सरल स्वर-समूह, वक्र चाल नहीं)।
        function playRagaScale() {
            if (state.isPlaying) return;
            const notes = SWARAS.filter(s => RAGAS[state.raga].notes.includes(s.id));
            const ascending = notes.map(swara => ({ swara, mult: 1 }));
            const topSa = [{ swara: SWARAS[0], mult: 2 }];
            const descending = [...notes].reverse().map(swara => ({ swara, mult: 1 }));
            setFeedback('msgScalePlaying', '');
            playItems([...ascending, ...topSa, ...descending], {
                noteDuration: 0.6,
                gap: 0.05,
                onDone: () => setFeedback('msgScaleDone', '')
            });
        }

        function playTanpuraString(ratio, startTime) {
            const freq = baseFreq * ratio;
            const oscSaw = audioCtx.createOscillator();
            const oscTri = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            oscSaw.type = 'sawtooth';
            oscTri.type = 'triangle';
            oscSaw.frequency.setValueAtTime(freq, startTime);
            oscTri.frequency.setValueAtTime(freq, startTime);

            filter.type = 'lowpass';
            filter.Q.setValueAtTime(2.5, startTime);
            filter.frequency.setValueAtTime(freq * 8, startTime);
            filter.frequency.exponentialRampToValueAtTime(freq * 1.5, startTime + 1.5);
            filter.frequency.linearRampToValueAtTime(freq, startTime + 4.5);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.3, startTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.1, startTime + 2.0);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 5.0);

            const mixGainSaw = audioCtx.createGain();
            const mixGainTri = audioCtx.createGain();
            mixGainSaw.gain.value = 0.35;
            mixGainTri.gain.value = 0.65;
            oscSaw.connect(mixGainSaw);
            oscTri.connect(mixGainTri);
            mixGainSaw.connect(filter);
            mixGainTri.connect(filter);
            filter.connect(gain);
            gain.connect(tanpuraMasterGain);

            oscSaw.start(startTime);
            oscTri.start(startTime);
            oscSaw.stop(startTime + 5.5);
            oscTri.stop(startTime + 5.5);
        }

        function tanpuraFirstRatio() {
            let key = state.tanpuraTune;
            if (key === 'auto') {
                const notes = RAGAS[state.raga].notes;
                key = notes.includes('P') ? 'P' : (notes.includes('N') ? 'N' : 'm');
            }
            return TANPURA_TUNINGS[key].ratio;
        }

        function scheduleTanpuraCycle() {
            if (!state.tanpuraOn) return;
            const now = audioCtx.currentTime;
            playTanpuraString(tanpuraFirstRatio(), now);
            playTanpuraString(1.0, now + 1.0);
            playTanpuraString(1.0, now + 2.0);
            playTanpuraString(0.5, now + 3.0);
        }

        function toggleTanpura() {
            initAudio();
            state.tanpuraOn = !state.tanpuraOn;
            els.tanpuraToggleBtn.classList.toggle('is-on', state.tanpuraOn);
            els.tanpuraToggleBtn.setAttribute('aria-pressed', String(state.tanpuraOn));
            els.tanpuraStateText.innerText = state.tanpuraOn ? t('on') : t('off');

            if (state.tanpuraOn) {
                scheduleTanpuraCycle();
                state.tanpuraInterval = window.setInterval(scheduleTanpuraCycle, 4500);
            } else {
                window.clearInterval(state.tanpuraInterval);
            }
        }

        /* सेटिंग का संग्रह (केवल इसी ब्राउज़र में) */
        function saveSettings() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    scale: els.scaleSelect.value,
                    lang: lang,
                    raga: state.raga,
                    tuning: state.tuning,
                    mode: state.modeLength,
                    difficulty: state.difficulty,
                    tanpuraTune: state.tanpuraTune,
                    mandra: els.mandraCheck.checked,
                    taar: els.taarCheck.checked,
                    fluteVol: els.fluteVolSlider.value,
                    tanpuraVol: els.tanpuraVolSlider.value
                }));
            } catch (error) { /* संग्रह उपलब्ध न हो तो चुपचाप आगे बढ़ें */ }
        }

        function loadSettings() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (error) { saved = {}; }

            if (saved.scale !== undefined && SCALES[saved.scale]) els.scaleSelect.value = saved.scale;
            if (saved.raga && RAGAS[saved.raga]) state.raga = saved.raga;
            if (saved.tuning === 'raga' || saved.tuning === 'standard') state.tuning = saved.tuning;
            if ([1, 2, 3, 4, 5].includes(Number(saved.mode))) state.modeLength = Number(saved.mode);
            if (STEP_LIMITS[saved.difficulty] !== undefined) state.difficulty = saved.difficulty;
            if (TANPURA_TUNINGS[saved.tanpuraTune]) state.tanpuraTune = saved.tanpuraTune;
            els.mandraCheck.checked = Boolean(saved.mandra);
            els.taarCheck.checked = Boolean(saved.taar);
            if (saved.fluteVol !== undefined) els.fluteVolSlider.value = saved.fluteVol;
            if (saved.tanpuraVol !== undefined) els.tanpuraVolSlider.value = saved.tanpuraVol;

            baseFreq = SCALES[els.scaleSelect.value].freq;
            els.ragaSelect.value = state.raga;
            els.tuningSelect.value = state.tuning;
            els.modeSelect.value = String(state.modeLength);
            els.stepSelect.value = state.difficulty;
            els.tanpuraTuneSelect.value = state.tanpuraTune;
        }

        /* दृश्य */
        function detectLanguage() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
                if (saved.lang === 'hi' || saved.lang === 'en') return saved.lang;
            } catch (error) { /* ignore */ }
            // पहली बार: हिंदी/मराठी/संस्कृत/नेपाली ब्राउज़र में हिंदी, अन्यथा अंग्रेज़ी। इसे बदलने के लिए यहाँ 'hi' या 'en' लौटाएँ।
            return /^(hi|mr|sa|ne)/i.test(navigator.language || '') ? 'hi' : 'en';
        }

        function buildSelect(select, entries) {
            const previous = select.value;
            select.innerHTML = '';
            entries.forEach(([value, label]) => {
                const option = document.createElement('option');
                option.value = value;
                option.innerText = label;
                select.appendChild(option);
            });
            if (previous && [...select.options].some(option => option.value === previous)) select.value = previous;
        }

        // भाषा बदलने पर सारा पाठ फिर से बनाएँ।
        function applyLanguage() {
            document.documentElement.lang = lang;
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

            buildSelect(els.scaleSelect, SCALES.map((scale, index) =>
                [String(index), `${lang === 'hi' ? scale.name : SCALE_EN[index]} (${num(scale.freq.toFixed(2))} ${t('hz')})`]));
            buildSelect(els.ragaSelect, Object.keys(RAGAS).map(key => [key, ragaName(key)]));
            buildSelect(els.tanpuraTuneSelect, Object.keys(TANPURA_TUNINGS).map(key =>
                [key, lang === 'hi' ? TANPURA_TUNINGS[key].name : TANPURA_TUNINGS[key].en]));

            els.tanpuraStateText.innerText = state.tanpuraOn ? t('on') : t('off');
            els.langToggle.textContent = t('langBtn');
            renderScore();
            refreshRagaView();
            renderVisualizer();
            renderFeedback();
            renderShrutiRef();
        }

        function renderShrutiRef() {
            let rows = '';
            Object.keys(RAGAS).forEach(key => {
                const raga = RAGAS[key];
                if (!raga.tuning) return;
                const swaras = SWARAS.filter(s => raga.notes.includes(s.id) && raga.tuning[s.id] !== undefined);
                swaras.forEach((swara, index) => {
                    const used = raga.tuning[swara.id];
                    const diff = Math.round(centsOf(used) - centsOf(swara.ratio));
                    const sign = diff > 0 ? '+' : (diff < 0 ? '−' : '');
                    rows += `<tr>${index === 0 ? `<th scope="rowgroup" rowspan="${swaras.length}">${ragaName(key)}</th>` : ''}`
                        + `<td>${sym(swara)}</td>`
                        + `<td>${ratioText(used)} · ${num(Math.round(centsOf(used)))}</td>`
                        + `<td>${ratioText(swara.ratio)} · ${num(Math.round(centsOf(swara.ratio)))}</td>`
                        + `<td>${sign}${num(Math.abs(diff))}</td></tr>`;
                });
            });
            els.shrutiRef.innerHTML = `<p class="ref-intro">${t('refIntro')}</p>`
                + `<div class="table-wrap"><table class="ref-table"><thead><tr><th>${t('refRaga')}</th><th>${t('refSwara')}</th>`
                + `<th>${t('refUsed')}</th><th>${t('refStd')}</th><th>${t('refDiff')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        }

        function setupUI() {
            lang = detectLanguage();

            SAPTAKS.forEach(saptak => {
                const grid = $(`${saptak.id}Grid`);
                SWARAS.forEach(swara => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.id = `btn-${saptak.id}-${swara.id}`;
                    button.className = `swara-btn ${swara.isShuddha ? 'shuddha' : 'vikrit'}`;

                    const dot = saptak.dotPosition
                        ? `<span class="octave-dot ${saptak.dotPosition}" aria-hidden="true"></span>`
                        : '';
                    button.innerHTML = `${dot}
                        <span class="swara-symbol"></span>
                        <span class="swara-detail"></span>`;
                    button.addEventListener('click', () => handleGuessInput(saptak.id, swara.id));
                    grid.appendChild(button);
                });
            });

            applyLanguage();
            els.scaleSelect.value = '1';
            els.ragaSelect.value = state.raga;
            loadSettings();
            els.mandraGrid.classList.toggle('hidden', !els.mandraCheck.checked);
            els.taarGrid.classList.toggle('hidden', !els.taarCheck.checked);
            updateOctaveLabels();
            refreshRagaView();
        }

        function updateOctaveLabels() {
            const showLabels = els.mandraCheck.checked || els.taarCheck.checked;
            els.taarLabel.hidden = !(showLabels && els.taarCheck.checked);
            els.madhyaLabel.hidden = !showLabels;
            els.mandraLabel.hidden = !(showLabels && els.mandraCheck.checked);
        }

        // राग या स्वरस्थान बदलने पर सभी संबंधित दृश्य फिर से बनाएँ।
        function refreshRagaView() {
            renderRagaInfo();
            updateGridState();
            updateControls();
        }

        function renderRagaInfo() {
            const raga = RAGAS[state.raga];
            els.ragaInfoTitle.innerText = t('ragaInfoTitle', { name: ragaName(state.raga) });
            els.ragaChips.innerHTML = '';

            const atiNames = [];
            SWARAS.filter(s => raga.notes.includes(s.id)).forEach(swara => {
                const ratio = effectiveRatio(swara);
                const ati = isAti(swara, ratio);
                if (ati) atiNames.push({ swara, ratio });

                const chip = document.createElement('span');
                chip.className = `chip ${swara.isShuddha ? 'shuddha' : 'vikrit'}${ati ? ' ati' : ''}`;
                chip.title = `${swaraName(swara)} — ${centsText(ratio)}`;
                chip.innerHTML = `${sym(swara)}<small>${swaraDetail(swara)}</small>`;
                els.ragaChips.appendChild(chip);
            });

            const parts = [];
            if (atiNames.length > 0) {
                const list = atiNames.map(({ swara, ratio }) =>
                    t('atiItem', { sym: sym(swara), cents: centsText(ratio), std: centsText(swara.ratio) })
                ).join('; ');
                parts.push(t('atiNote', { list }));
            } else if (state.tuning === 'standard' && raga.tuning) {
                parts.push(t('stdNote'));
            }
            const note = lang === 'hi' ? raga.note : raga.noteEn;
            if (state.tuning === 'raga' && note) parts.push(note);
            els.ragaNote.innerText = parts.join(' ');
        }

        function updateGridState() {
            const allowedNotes = RAGAS[state.raga].notes;
            const visibleCount = allowedNotes.length;
            const cols = visibleCount <= 8 ? visibleCount : 6;

            SAPTAKS.forEach(saptak => {
                $(`${saptak.id}Grid`).style.setProperty('--cols', cols);
                SWARAS.forEach(swara => {
                    const button = $(`btn-${saptak.id}-${swara.id}`);
                    if (!button) return;
                    const inRaga = allowedNotes.includes(swara.id);
                    const ratio = effectiveRatio(swara);
                    const ati = isAti(swara, ratio);

                    button.classList.toggle('out-of-raga', !inRaga);
                    button.classList.toggle('ati', ati);
                    button.disabled = state.isPlaying || !inRaga;
                    button.querySelector('.swara-symbol').innerText = sym(swara);
                    button.querySelector('.swara-detail').innerText = swaraDetail(swara);
                    button.title = `${swaraName(swara)} — ${centsText(ratio)}`;
                    button.setAttribute('aria-label', t('ariaNote', { oct: octaveWord(saptak.id), swara: swaraName(swara) }));
                });
            });
        }

        function updateControls() {
            const busy = state.isPlaying;
            const hasPrompt = state.promptSequence.length > 0;
            els.playPromptBtn.disabled = busy;
            els.repeatPromptBtn.disabled = busy || !hasPrompt;
            els.revealBtn.disabled = busy || !hasPrompt;
            els.playSaBtn.disabled = busy;
            els.playRagaBtn.disabled = busy;
            updateGridState();
        }

        function renderScore() {
            els.scoreVal.innerText = num(state.score);
            els.totalVal.innerText = num(state.total);
            els.streakVal.innerText = num(state.streak);
        }

        function renderVisualizer(isError = false) {
            els.guessVisualizer.innerHTML = '';
            for (let index = 0; index < state.modeLength; index++) {
                const box = document.createElement('div');
                box.className = 'guess-slot';

                if (index < state.guessSequence.length) {
                    const guess = state.guessSequence[index];
                    const swara = SWARAS.find(item => item.id === guess.swaraId);
                    const saptak = SAPTAKS.find(item => item.id === guess.saptakId);
                    if (saptak.dotPosition) {
                        const dot = document.createElement('span');
                        dot.className = `octave-dot ${saptak.dotPosition}`;
                        dot.setAttribute('aria-hidden', 'true');
                        box.appendChild(dot);
                    }
                    const symbol = document.createElement('span');
                    symbol.className = 'slot-symbol';
                    symbol.innerText = sym(swara);
                    box.appendChild(symbol);
                    const detail = document.createElement('span');
                    detail.className = 'slot-detail';
                    detail.innerText = swaraDetail(swara);
                    box.appendChild(detail);
                    box.classList.add(isError && index === state.guessSequence.length - 1 ? 'incorrect' : 'correct');
                } else {
                    box.classList.add('empty');
                    box.innerText = '·';
                }
                els.guessVisualizer.appendChild(box);
            }
        }

        // संदेश कुंजी के रूप में रखे जाते हैं ताकि भाषा बदलने पर वही संदेश नई भाषा में दिखे।
        function setFeedback(key, type, params) {
            lastFeedback = { key, type: type || '', params: params || null };
            renderFeedback();
        }

        function renderFeedback() {
            const resolved = {};
            if (lastFeedback.params) {
                Object.keys(lastFeedback.params).forEach(name => {
                    const value = lastFeedback.params[name];
                    resolved[name] = typeof value === 'function' ? value() : value;
                });
            }
            els.feedbackText.innerText = t(lastFeedback.key, resolved);
            els.feedbackText.className = `feedback${lastFeedback.type ? ` ${lastFeedback.type}` : ''}`;
        }

        function describeSequence(sequence) {
            return sequence.map(note => {
                const swara = SWARAS.find(item => item.id === note.swaraId);
                const saptak = SAPTAKS.find(item => item.id === note.saptakId);
                const octavePrefix = saptak.id === 'madhya' ? '' : `${octaveWord(saptak.id)} `;
                return `${octavePrefix}${swaraName(swara)}`;
            }).join(' — ');
        }

        function clearRound() {
            state.promptSequence = [];
            updateControls();
        }

        /* अभ्यास का तर्क */
        function generatePrompt() {
            if (state.isPlaying) return;
            initAudio();
            state.guessSequence = [];
            renderVisualizer();
            setFeedback('msgListening', '');

            const allowedNotes = RAGAS[state.raga].notes;
            const allowedSaptaks = ['madhya'];
            if (els.mandraCheck.checked) allowedSaptaks.push('mandra');
            if (els.taarCheck.checked) allowedSaptaks.push('taar');

            // स्वरों को नीचे से ऊपर के क्रम में रखें, ताकि पास-पास के स्वर सचमुच पास के हों।
            const validPool = [];
            ['mandra', 'madhya', 'taar'].forEach(saptakId => {
                if (!allowedSaptaks.includes(saptakId)) return;
                SWARAS.forEach(swara => {
                    if (allowedNotes.includes(swara.id)) validPool.push({ saptakId, swaraId: swara.id });
                });
            });

            const maxStep = STEP_LIMITS[state.difficulty];
            const sequence = [];
            let currentIndex = Math.floor(Math.random() * validPool.length);
            for (let index = 0; index < state.modeLength; index++) {
                if (index > 0) {
                    const low = Math.max(0, currentIndex - maxStep);
                    const high = Math.min(validPool.length - 1, currentIndex + maxStep);
                    let next = currentIndex;
                    if (high > low) {
                        do { next = low + Math.floor(Math.random() * (high - low + 1)); } while (next === currentIndex);
                    }
                    currentIndex = next;
                }
                sequence.push(validPool[currentIndex]);
            }

            state.promptSequence = sequence;
            playSequence(state.promptSequence);
        }

        function repeatPrompt() {
            if (state.promptSequence.length === 0 || state.isPlaying) return;
            setFeedback('msgRepeating', '');
            playSequence(state.promptSequence);
        }

        function revealAnswer() {
            if (state.promptSequence.length === 0 || state.isPlaying) return;
            state.total++;
            state.streak = 0;
            renderScore();
            const answer = state.promptSequence;
            setFeedback('msgReveal', 'error', { seq: () => describeSequence(answer) });
            clearRound();
        }

        function handleGuessInput(saptakId, swaraId) {
            initAudio();
            if (state.isPlaying) return;

            // कोई स्वर सुनाया न गया हो तो बटन केवल स्वर परखने के लिए है।
            if (state.promptSequence.length === 0) {
                playSingleNotePreview(saptakId, swaraId);
                return;
            }

            const currentGuessIndex = state.guessSequence.length;
            if (currentGuessIndex >= state.modeLength) return;

            playSingleNotePreview(saptakId, swaraId);
            const expectedNote = state.promptSequence[currentGuessIndex];
            const isCorrect = expectedNote.swaraId === swaraId && expectedNote.saptakId === saptakId;

            state.guessSequence.push({ saptakId, swaraId });

            if (isCorrect) {
                renderVisualizer();
                if (state.guessSequence.length === state.modeLength) {
                    state.score++;
                    state.total++;
                    state.streak++;
                    renderScore();
                    setFeedback('msgCorrect', 'success');
                    clearRound();
                }
            } else {
                state.total++;
                state.streak = 0;
                renderScore();
                renderVisualizer(true);
                const answer = state.promptSequence;
                setFeedback('msgWrong', 'error', { seq: () => describeSequence(answer) });
                clearRound();
            }
        }

        function resetRound(message) {
            state.promptSequence = [];
            state.guessSequence = [];
            renderVisualizer();
            refreshRagaView();
            setFeedback(message, '');
        }

        /* नियंत्रण */
        els.scaleSelect.addEventListener('change', event => {
            baseFreq = SCALES[event.target.value].freq;
            saveSettings();
        });

        els.ragaSelect.addEventListener('change', event => {
            state.raga = event.target.value;
            saveSettings();
            resetRound('msgRagaChanged');
        });

        els.tuningSelect.addEventListener('change', event => {
            state.tuning = event.target.value;
            saveSettings();
            resetRound(state.tuning === 'raga' ? 'msgTuningRaga' : 'msgTuningStd');
        });

        els.modeSelect.addEventListener('change', event => {
            state.modeLength = Number.parseInt(event.target.value, 10);
            saveSettings();
            resetRound('msgModeChanged');
        });

        els.stepSelect.addEventListener('change', event => {
            state.difficulty = event.target.value;
            saveSettings();
            resetRound('msgStepChanged');
        });

        els.tanpuraTuneSelect.addEventListener('change', event => {
            state.tanpuraTune = event.target.value;
            saveSettings();
        });

        els.mandraCheck.addEventListener('change', event => {
            els.mandraGrid.classList.toggle('hidden', !event.target.checked);
            updateOctaveLabels();
            saveSettings();
        });

        els.taarCheck.addEventListener('change', event => {
            els.taarGrid.classList.toggle('hidden', !event.target.checked);
            updateOctaveLabels();
            saveSettings();
        });

        els.playPromptBtn.addEventListener('click', generatePrompt);
        els.repeatPromptBtn.addEventListener('click', repeatPrompt);
        els.revealBtn.addEventListener('click', revealAnswer);
        els.playSaBtn.addEventListener('click', playReferenceSa);
        els.playRagaBtn.addEventListener('click', playRagaScale);
        els.tanpuraToggleBtn.addEventListener('click', toggleTanpura);
        els.langToggle.addEventListener('click', () => {
            lang = lang === 'hi' ? 'en' : 'hi';
            saveSettings();
            applyLanguage();
        });

        els.resetBtn.addEventListener('click', () => {
            state.score = 0;
            state.total = 0;
            state.streak = 0;
            state.promptSequence = [];
            state.guessSequence = [];
            renderScore();
            renderVisualizer();
            updateControls();
            setFeedback('msgScoreReset', '');
        });

        els.fluteVolSlider.addEventListener('input', event => {
            if (fluteMasterGain) fluteMasterGain.gain.value = event.target.value;
            saveSettings();
        });

        els.tanpuraVolSlider.addEventListener('input', event => {
            if (tanpuraMasterGain) tanpuraMasterGain.gain.value = event.target.value;
            saveSettings();
        });

        document.addEventListener('keydown', event => {
            if (event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.matches('input, select, textarea')) return;
            const key = event.key.toLowerCase();
            if (key === 'n' && !els.playPromptBtn.disabled) generatePrompt();
            if (key === 'r' && !els.repeatPromptBtn.disabled) repeatPrompt();
        });

        window.addEventListener('DOMContentLoaded', setupUI);
    </script>
</body>
</html>
